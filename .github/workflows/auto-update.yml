name: Auto Update Live & Jadwal Bola

on:
  # 1. Jalan otomatis tiap 5 menit
  schedule:
    - cron: "*/5 * * * *"

  # 2. Manual run (opsional)
  workflow_dispatch:

  # 3. Jalan otomatis jika file sumber berubah
  push:
    paths:
      - "epg.xml"
      - "playlist.m3u"
      - "*.py"
      - "requirements.txt"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate live.m3u
        run: |
          python live_event_generator.py

      - name: Commit & push if live.m3u changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add live.m3u

          # Commit hanya jika ada perubahan
          if ! git diff --cached --quiet; then
            git commit -m "Auto update live.m3u"
            git push
          else
            echo "No changes to commit"
          fi
