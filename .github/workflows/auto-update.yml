name: Auto Update Soccer EPG & Live Event

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - run: pip install -r requirements.txt

    - run: python epg_generator.py
    - run: python live_event_generator.py

    - run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add epg.xml live.m3u
        git diff --cached --quiet || git commit -m "Auto update soccer EPG & Live Event"
        git push
