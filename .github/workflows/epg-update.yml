name: Update EPG (Daily 00:00 UTC)

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install lxml requests

      - name: Generate epg.xml
        run: |
          python epg/epg_generator.py

      - name: Commit & push epg.xml if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Daily update epg.xml (00:00 UTC)"
          git push
