name: Update EPG

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install lxml requests

      - run: python epg/epg_generator.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update epg.xml"
          git push
