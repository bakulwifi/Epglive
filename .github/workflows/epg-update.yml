name: Daily Soccer EPG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate epg.xml
        run: python epg/epg_generator.py

      - name: Commit epg.xml
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Daily soccer-only EPG"
          git push
